# Supabase (PostgreSQL). Activate with SPRING_PROFILES_ACTIVE=supabase
# Set SUPABASE_DB_URL / SUPABASE_DB_USER / SUPABASE_DB_PASSWORD as environment variables on the server,
# or locally in supabase-local.properties next to pom.xml (git-ignored).
spring.config.import=optional:file:./supabase-local.properties

spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Free-plan pooler allows few connections; keep the pool small
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
