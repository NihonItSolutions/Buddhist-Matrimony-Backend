spring.application.name=buddhist-matrimony-backend
# Local secrets (MAIL_PASSWORD etc.) - git-ignored file next to pom.xml. On Render, use environment variables instead.
spring.config.import=optional:file:./local-secrets.properties
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/buddhist_matrimony?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/{vendor}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

springdoc.swagger-ui.path=/swagger-ui/index.html
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true

app.jwt.secret=${JWT_SECRET:change-this-development-secret-change-this-development-secret}
app.jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:15m}
app.jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:30d}
app.otp.expiration=${OTP_EXPIRATION:5m}
app.otp.resend-cooldown=${OTP_RESEND_COOLDOWN:60s}
app.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
app.profile.minimum-age=${PROFILE_MINIMUM_AGE:18}
app.profile.profile-view-deduplication-period=${PROFILE_VIEW_DEDUP_PERIOD:24h}
app.profile.max-photos=${PROFILE_MAX_PHOTOS:8}
app.file-storage.location=${FILE_STORAGE_LOCATION:./uploads}
app.file-storage.max-photo-size-bytes=${MAX_PHOTO_SIZE_BYTES:5242880}
app.file-storage.allowed-photo-content-types=image/jpeg,image/png,image/webp
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:4201,http://127.0.0.1:4201}
app.payment.gateway=${PAYMENT_GATEWAY:upi}
app.payment.webhook-secret=${PAYMENT_WEBHOOK_SECRET:dev-webhook-secret}
app.payment.signature-secret=${PAYMENT_SIGNATURE_SECRET:dev-payment-secret}
app.payment.stripe.secret-key=${STRIPE_SECRET_KEY:sk_test_placeholderSecretKey}
app.payment.stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:pk_test_placeholderPublishableKey}
app.payment.cashfree.app-id=${CASHFREE_APP_ID:TEST10346789abcdef}
app.payment.cashfree.secret-key=${CASHFREE_SECRET_KEY:TEST123456789abcdef}
app.payment.cashfree.env=${CASHFREE_ENV:sandbox}
app.payment.cashfree.api-version=${CASHFREE_API_VERSION:2023-08-01}
app.payment.upi.vpa=${UPI_VPA:kamble.snehal23-2@okicici}
app.payment.upi.payee-name=${UPI_PAYEE_NAME:Snehal Kamble}
# Who gets an email when a user submits a UTR (defaults to the Gmail account used to send mail)
app.payment.upi.admin-alert-email=${UPI_ADMIN_ALERT_EMAIL:${MAIL_USERNAME:kamble.snehal23@gmail.com}}
app.development.admin-email=${DEV_ADMIN_EMAIL:admin@buddhistmatrimony.local}
app.development.admin-mobile=${DEV_ADMIN_MOBILE:9999999999}
app.development.admin-password=${DEV_ADMIN_PASSWORD:password123}

# Gmail SMTP defaults. Keep username/password in environment variables or IntelliJ Run Configuration.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:kamble.snehal23@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTION_TIMEOUT:10000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_TIMEOUT:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT:10000}
