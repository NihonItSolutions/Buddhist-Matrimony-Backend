spring.datasource.url=jdbc:h2:mem:matrimony_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
app.jwt.secret=change-this-test-secret-change-this-test-secret-change-this-test-secret
app.jwt.access-token-expiration=15m
app.jwt.refresh-token-expiration=30d
app.otp.expiration=5m
app.otp.resend-cooldown=60s
app.otp.max-attempts=5
app.profile.minimum-age=18
app.profile.profile-view-deduplication-period=24h
app.profile.max-photos=8
app.file-storage.location=./target/uploads-test
app.file-storage.max-photo-size-bytes=5242880
app.file-storage.allowed-photo-content-types=image/jpeg,image/png,image/webp
app.cors.allowed-origins=http://localhost:4200
app.payment.gateway=mock
app.payment.webhook-secret=test-webhook-secret
app.payment.signature-secret=test-payment-secret
